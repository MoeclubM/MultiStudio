[package]
name = "live-translator"
version = "0.1.0"
description = "LiveTranslator — realtime ASR + LLM translation"
authors = ["LiveTranslator"]
edition = "2021"
license = "MIT"
repository = "https://github.com/live-translator/live-translator"

[lib]
name = "live_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
cpal = { version = "0.15", optional = true }
futures = "0.3"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["serde", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation"] }

[features]
default = ["audio-cpal"]
audio-cpal = ["cpal"]
